<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ひらがなクイズ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .quiz-box {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      max-width: 480px;
      margin: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
    }
    .question {
      font-size: 1.2em;
      margin-bottom: 10px;
    }
    .hint {
      margin-top: 10px;
      color: #0077aa;
      font-weight: bold;
    }
    input {
      width: 100%;
      font-size: 1.2em;
      padding: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 1em;
    }
    .message {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="quiz-box">
  <h1>さなクイズ</h1>
  <div id="question" class="question"></div>
  <input id="answerInput" type="text" placeholder="ひらがなで入力">
  <button onclick="checkAnswer()">こたえる</button>
  <div id="message" class="message"></div>
  <div id="hint" class="hint"></div>
</div>

<script>
/* =====================
   クイズ定義（JSON）
===================== */
const quizData = {
  clearMessage: "🎉ぜんもんせいかい🎉くもんバッグをみろ",
  questions: [
    {
      question: "さなのかおは？",
      answer: "かわいい",
      hint: "か ◯ ◯ ◯"
    },
    {
      question: "さなはインストロールのことをなんという？",
      answer: "てっち",
      hint: "「て」からはじまる３もじ"
    },
    {
      question: "くま→きりん→うさぎ→◯◯◯",
      answer: "こじか",
      hint: "「こ」からはじまる３もじ"
    },
    {
      question: "さながよくみるピンクのスライムのなまえは",
      answer: "さむちん",
      hint: "◯◯ちん"
    }, 
    {
      question: "さなのかおは？",
      answer: "かわいい",
      hint: "か ◯ ◯ ◯"
    },  
    {
      question: "さなは？",
      answer: "かわいい",
      hint: "か ◯ ◯ ◯"
    },
    {
      question: "かわいい？",
      answer: "かわいい",
      hint: "か ◯ ◯ ◯"
    }
  ]
};

/* =====================
   ロジック
===================== */
let currentIndex = 0;
let mistakeCount = 0;

const questionEl = document.getElementById("question");
const inputEl = document.getElementById("answerInput");
const messageEl = document.getElementById("message");
const hintEl = document.getElementById("hint");

function normalize(str) {
  return str.replace(/っ/g, "つ");
}

function isHiragana(str) {
  return /^[ぁ-んー]+$/.test(str);
}

function showQuestion() {
  questionEl.textContent = quizData.questions[currentIndex].question;
  inputEl.value = "";
  messageEl.textContent = "";
  hintEl.textContent = "";
  mistakeCount = 0;
}

function checkAnswer() {
  const userAnswer = inputEl.value.trim();

  if (!isHiragana(userAnswer)) {
    messageEl.textContent = "⚠ ひらがなで入力してください";
    return;
  }

  const currentQuiz = quizData.questions[currentIndex];

  if (normalize(userAnswer) === normalize(currentQuiz.answer)) {
    currentIndex++;
    if (currentIndex >= quizData.questions.length) {
      questionEl.textContent = quizData.clearMessage;
      inputEl.style.display = "none";
      messageEl.textContent = "";
      hintEl.textContent = "";
    } else {
      showQuestion();
    }
  } else {
    mistakeCount++;
    messageEl.textContent = `❌ ちがいます（${mistakeCount}かい）`;

    if (mistakeCount >= 3) {
      hintEl.textContent = "💡 ヒント：" + currentQuiz.hint;
    }
  }
}

// 初期表示
showQuestion();
</script>

</body>
</html>
