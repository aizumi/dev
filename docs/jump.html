<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>はやとのぼうそうチャリゲーム</title>
    <style>
        :root {
            --bg-color: #87CEEB;
            --ground-color: #8B4513;
            --grass-color: #2E8B57;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            overflow: hidden;
            touch-action: manipulation;
        }

        #game-container {
            position: relative;
            width: 95%;
            max-width: 600px;
            aspect-ratio: 4 / 3;
            background-color: #fff;
            border: 4px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        #game-title {
            position: absolute;
            top: 5%;
            width: 100%;
            text-align: center;
            font-size: clamp(18px, 6vw, 32px);
            font-weight: 900;
            color: #FFD700;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            z-index: 10;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            pointer-events: none;
            letter-spacing: 1px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .ui-container {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #jump-button {
            width: 80px;
            height: 80px;
            background-color: #FF4081;
            color: white;
            border: 6px solid #c2185b;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 5px 0 #880e4f;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #jump-button:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #880e4f;
        }

        #message-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            width: 80%;
            max-width: 300px;
            border-radius: 20px;
            text-align: center;
            display: none;
            border: 6px solid #FFD700;
            z-index: 20;
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        #message-overlay h2 { margin-top: 0; color: #d32f2f; font-size: 22px; }
        #message-overlay p { font-size: 16px; color: #333; }
        #message-overlay button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2E7D32;
        }

        .score-display {
            position: absolute;
            top: 15%;
            left: 10px;
            font-size: clamp(14px, 4vw, 24px);
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 0 white;
            z-index: 5;
            background: rgba(255,255,255,0.5);
            padding: 3px 10px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-title">はやとのぼうそうチャリゲーム</div>
        
        <div id="score-box" class="score-display">スコア: <span id="score-val">0</span></div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="message-overlay">
            <h2 id="msg-title">✨おめでとう！✨</h2>
            <p id="msg-text">ふでばこをさがせ</p>
            <button onclick="closeMessage()">もっと あそぶ！</button>
        </div>
    </div>

    <div class="ui-container">
        <div id="jump-button">ジャンプ</div>
        <p style="margin: 0; color: #666; font-size: 12px;">（パソコンはスペースキーでもOK）</p>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreVal = document.getElementById("score-val");
    const scoreBox = document.getElementById("score-box");
    const gameTitleDiv = document.getElementById("game-title");
    const jumpBtn = document.getElementById("jump-button");
    const overlay = document.getElementById("message-overlay");
    const container = document.getElementById("game-container");

    const bikeImage = new Image();
    bikeImage.src = 'https://aizumi.github.io/dev/bike.png';
    let imageLoaded = false;
    bikeImage.onload = () => { 
        imageLoaded = true;
        if(!animationId) startIntro(); 
    };

    function resize() {
        canvas.width = 800;
        canvas.height = 600;
    }
    resize();

    let score = 0;
    let gameActive = false;
    let paused = false;
    let highscoreReached = false;
    let animationId = null;

    let introTimer = 0;
    const introDuration = 300; 
    let cameraScale = 5.0; 

    const clouds = [
        {x: 100, y: 50, s: 0.5},
        {x: 400, y: 80, s: 0.3},
        {x: 700, y: 40, s: 0.4}
    ];

    const player = {
        x: 80,
        y: 430,
        w: 80,
        h: 80,
        dy: 0,
        jumpForce: 16,
        gravity: 0.7,
        grounded: false,
        rotation: 0
    };

    let obstacles = [];
    let frameCount = 0;

    function handleJump() {
        if (introTimer < introDuration) return; 
        
        if (!gameActive && !paused) {
            restart();
            return;
        }
        if (player.grounded && !paused) {
            player.dy = -player.jumpForce;
            player.grounded = false;
        }
    }

    jumpBtn.addEventListener('touchstart', (e) => { e.preventDefault(); handleJump(); }, {passive: false});
    jumpBtn.addEventListener('mousedown', handleJump);
    window.addEventListener('keydown', (e) => { if(e.code === 'Space') { e.preventDefault(); handleJump(); } });

    function startIntro() {
        introTimer = 0;
        cameraScale = 5.0;
        gameActive = false;
        frameCount = 0;
        scoreBox.style.opacity = "0";
        gameTitleDiv.style.opacity = "0";
        container.style.backgroundColor = "#fff";
        
        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(update);
    }

    function restart() {
        score = 0;
        scoreVal.textContent = score;
        obstacles = [];
        gameActive = false;
        highscoreReached = false;
        player.y = 430;
        player.dy = 0;
        player.rotation = 0;
        player.grounded = true;
        frameCount = 0;
        overlay.style.display = "none";
        paused = false;
        startIntro();
    }

    function closeMessage() {
        overlay.style.display = "none";
        paused = false;
    }

    function drawBike(x, y, w, h) {
        ctx.save();
        ctx.translate(x + w / 2, y + h / 2);
        
        if (gameActive && !player.grounded) {
            player.rotation = Math.max(-0.3, player.dy * 0.02);
        } else {
            player.rotation = 0;
        }
        ctx.rotate(player.rotation);

        if (imageLoaded) {
            ctx.drawImage(bikeImage, -w / 2, -h / 2, w, h);
        } else {
            ctx.fillStyle = "#FF4081";
            ctx.fillRect(-w/2, -h/2, w, h);
        }
        ctx.restore();
    }

    function drawBackground(opacity = 1) {
        ctx.globalAlpha = opacity;
        ctx.fillStyle = "#87CEEB";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#45a049";
        ctx.beginPath();
        ctx.moveTo(0, 500); ctx.lineTo(200, 250); ctx.lineTo(400, 500); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(300, 500); ctx.lineTo(550, 300); ctx.lineTo(800, 500); ctx.fill();

        ctx.fillStyle = "white";
        clouds.forEach(c => {
            ctx.beginPath();
            ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
            ctx.arc(c.x + 15, c.y - 10, 25, 0, Math.PI * 2);
            ctx.arc(c.x + 40, c.y, 20, 0, Math.PI * 2);
            ctx.fill();
            if (gameActive) c.x -= c.s;
            if (c.x < -60) c.x = 850;
        });

        ctx.fillStyle = "#8B4513";
        ctx.fillRect(0, 500, 800, 100);
        ctx.fillStyle = "#2E8B57";
        ctx.fillRect(0, 500, 800, 15);
        ctx.globalAlpha = 1.0;
    }

    function update() {
        if (paused) {
            animationId = requestAnimationFrame(update);
            return;
        }

        if (introTimer < introDuration) {
            introTimer++;
            let progress = introTimer / introDuration;
            cameraScale = 5.0 - (4.0 * Math.pow(progress, 0.6)); 
            
            if (introTimer === introDuration) {
                gameActive = true;
                scoreBox.style.opacity = "1";
                gameTitleDiv.style.opacity = "1";
                container.style.backgroundColor = "var(--bg-color)";
            }
        }

        if (gameActive) {
            player.dy += player.gravity;
            player.y += player.dy;

            if (player.y > 430) {
                player.y = 430;
                player.dy = 0;
                player.grounded = true;
            }

            frameCount++;

            // スコアに応じて障害物の出現間隔を少しずつ短くする（最低60フレーム）
            let spawnInterval = Math.max(60, 100 - Math.floor(score / 300) * 5);
            if (frameCount % spawnInterval === 0) {
                obstacles.push({
                    x: 850, y: 460, w: 40, h: 40, color: "#d32f2f"
                });
            }

            // 現在の速度を計算（初期速度6、スコア200ごとに+1）
            let currentSpeed = 6 + (score / 200);

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= currentSpeed;

                const hitBoxShrink = 15;
                if (player.x + hitBoxShrink < obstacles[i].x + obstacles[i].w &&
                    player.x + player.w - hitBoxShrink > obstacles[i].x &&
                    player.y + hitBoxShrink < obstacles[i].y + obstacles[i].h &&
                    player.y + player.h - hitBoxShrink > obstacles[i].y) {
                    gameActive = false;
                }

                if (obstacles[i].x + obstacles[i].w < 0) {
                    obstacles.splice(i, 1);
                    score += 100;
                    scoreVal.textContent = score;

                    // ゴールスコアを2000点に変更
                    if (score >= 2000 && !highscoreReached) {
                        highscoreReached = true;
                        paused = true;
                        overlay.style.display = "block";
                    }
                }
            }
        }

        draw();
        animationId = requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        if (introTimer < introDuration) {
            let bgOpacity = Math.max(0, (introTimer / introDuration - 0.5) / 0.5);
            drawBackground(bgOpacity);
        } else {
            drawBackground(1.0);
        }

        ctx.save();
        if (introTimer < introDuration) {
            const centerX = player.x + player.w / 2;
            const centerY = player.y + player.h / 2;
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(cameraScale, cameraScale);
            ctx.translate(-centerX, -centerY);
        }

        for (let ob of obstacles) {
            ctx.fillStyle = ob.color;
            ctx.fillRect(ob.x, ob.y, ob.w, ob.h);
        }

        drawBike(player.x, player.y, player.w, player.h);
        ctx.restore();

        if (!gameActive && introTimer >= introDuration) {
            ctx.fillStyle = "rgba(0,0,0,0.6)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "bold 40px sans-serif";
            ctx.fillText("ざんねん！", 400, 280);
            ctx.font = "24px sans-serif";
            ctx.fillText("ボタンをおして もういっかい！", 400, 340);
        }
    }
</script>
</body>
</html>
