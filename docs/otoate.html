<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3音あてクイズ</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #48c774;
            --bg-color: #f5f7fa;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        .screen { display: none; }
        .active { display: block; }
        
        h1 { color: #333; margin-bottom: 1.5rem; }
        .note-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .note-item { font-size: 0.9rem; }
        
        select, button {
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
        }
        .btn-main {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            margin-top: 1rem;
        }
        .answer-btns {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 1.5rem;
        }
        .btn-note {
            background: #eee;
            border: 1px solid #ddd;
            height: 50px;
            font-weight: bold;
        }
        .btn-note:active { background: #ddd; }
        .replay-btn {
            background: #6c757d;
            color: white;
            margin-bottom: 1rem;
        }
        .status { margin-bottom: 1rem; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen" class="screen active">
        <h1>音当て設定</h1>
        <p>使う音を選んでください</p>
        <div class="note-selector" id="checkbox-container">
            </div>
        <p>問題数</p>
        <select id="question-count">
            <option value="3">3問</option>
            <option value="5">5問</option>
        </select>
        <button class="btn-main" onclick="startGame()">スタート！</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="current-info" class="status">第 1 / 3 問</div>
        <button class="replay-btn" onclick="playQuestion()">🔊 もういちどきく</button>
        <div class="answer-btns" id="answer-container">
            </div>
        <div id="feedback" style="margin-top: 1rem; height: 1.5rem; font-weight: bold;"></div>
    </div>

    <div id="result-screen" class="screen">
        <h1>結果発表</h1>
        <p id="final-score" style="font-size: 1.5rem;"></p>
        <button class="btn-main" onclick="location.reload()">最初に戻る</button>
    </div>
</div>

<script>
    const notes = ['ド', 'レ', 'ミ', 'ファ', 'ソ', 'ラ', 'シ', 'ド(高)'];
    const freqs = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];
    
    let selectedNotes = [];
    let totalQuestions = 3;
    let currentQuestionIdx = 0;
    let correctCount = 0;
    let questionSounds = [];
    let audioCtx = null;

    // 初期化: チェックボックスとボタンの生成
    const cbContainer = document.getElementById('checkbox-container');
    const ansContainer = document.getElementById('answer-container');
    
    notes.forEach((note, i) => {
        // 設定用
        cbContainer.innerHTML += `
            <div class="note-item">
                <input type="checkbox" id="note-${i}" value="${i}" checked>
                <label for="note-${i}">${note}</label>
            </div>`;
        // 回答用
        ansContainer.innerHTML += `<button class="btn-note" onclick="checkAnswer(${i})">${note}</button>`;
    });

    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(freq) {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.type = 'sine';
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);
        osc.stop(audioCtx.currentTime + 0.8);
    }

    function startGame() {
        selectedNotes = [];
        notes.forEach((_, i) => {
            if (document.getElementById(`note-${i}`).checked) selectedNotes.push(i);
        });

        if (selectedNotes.length < 2) {
            alert("音は2つ以上選択してください");
            return;
        }

        totalQuestions = parseInt(document.getElementById('question-count').value);
        currentQuestionIdx = 0;
        correctCount = 0;
        
        showScreen('game-screen');
        nextQuestion();
    }

    function nextQuestion() {
        if (currentQuestionIdx >= totalQuestions) {
            showResult();
            return;
        }
        
        document.getElementById('current-info').innerText = `第 ${currentQuestionIdx + 1} / ${totalQuestions} 問`;
        document.getElementById('feedback').innerText = "";
        
        // ランダムに3音選ぶ
        questionSounds = [];
        for(let i=0; i<3; i++) {
            const randomIdx = selectedNotes[Math.floor(Math.random() * selectedNotes.length)];
            questionSounds.push(randomIdx);
        }
        
        setTimeout(playQuestion, 500);
    }

    function playQuestion() {
        questionSounds.forEach((noteIdx, i) => {
            setTimeout(() => playTone(freqs[noteIdx]), i * 700);
        });
    }

    // 簡易化のため「3音聴いて、その中の最後の1音を当てる」形式にしています
    function checkAnswer(userNoteIdx) {
        const lastNoteIdx = questionSounds[2];
        const feedback = document.getElementById('feedback');
        
        if (userNoteIdx === lastNoteIdx) {
            feedback.innerText = "⭕ 正解！";
            feedback.style.color = "green";
            correctCount++;
        } else {
            feedback.innerText = `❌ 残念！正解は「${notes[lastNoteIdx]}」`;
            feedback.style.color = "red";
        }

        currentQuestionIdx++;
        setTimeout(nextQuestion, 1500);
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showResult() {
        showScreen('result-screen');
        document.getElementById('final-score').innerText = `${totalQuestions}問中 ${correctCount}問正解！`;
    }
</script>

</body>
</html>
